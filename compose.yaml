services:
  pra:
    build: .
    ports:
      - "8787:8787"
    environment:
      PRA_HOST: 0.0.0.0
      PRA_PORT: "8787"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      PRA_EMAIL: ${PRA_EMAIL}
      PRA_PASSWORD: ${PRA_PASSWORD}
      PRA_PUBLIC_SUPABASE_URL: ${PRA_PUBLIC_SUPABASE_URL:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
